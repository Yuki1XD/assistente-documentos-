services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistente_docs
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: altere_esta_senha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente_docs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
